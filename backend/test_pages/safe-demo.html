<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Arogya Clinic - Front desk billing</title>
    <style>
      :root {
        --ink: #1a2433;
        --muted: #5b6b7c;
        --line: #d5dde8;
        --bg: #f3f6fa;
        --card: #fff;
        --accent: #0b6e4f;
        --warn: #9a3412;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, #e8eef6 0%, var(--bg) 28%, var(--bg) 100%);
        line-height: 1.45;
      }
      header.banner {
        background: #0f2744;
        color: #e8f1ff;
        padding: 1rem 1.25rem;
      }
      header.banner h1 { margin: 0; font-size: 1.25rem; font-weight: 650; }
      header.banner p { margin: 0.35rem 0 0; font-size: 0.85rem; opacity: 0.9; }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.25rem 1rem 3rem;
        display: grid;
        gap: 1rem;
      }
      section.card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
      }
      section.card h2 {
        margin: 0 0 0.75rem;
        font-size: 1rem;
        color: var(--accent);
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td {
        border-bottom: 1px solid var(--line);
        text-align: left;
        padding: 0.45rem 0.35rem;
      }
      th { width: 40%; color: var(--muted); font-weight: 600; }
      label {
        display: block;
        margin: 0.65rem 0 0.25rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input, button {
        font: inherit;
        width: 100%;
        padding: 0.45rem 0.55rem;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      button#pay {
        width: auto;
        margin-top: 0.85rem;
        background: var(--accent);
        color: #fff;
        border: 0;
        font-weight: 650;
        cursor: pointer;
        padding: 0.55rem 1rem;
      }
      #status {
        min-height: 1.2em;
        margin-top: 0.5rem;
        font-weight: 650;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header class="banner">
      <h1>Arogya Clinic - Front desk billing</h1>
      <p>Counter 3 · Shift board</p>
    </header>

    <main>
      <section class="card">
        <h2>Shift board</h2>
        <table>
          <tr><th>Amount due</th><td><strong>₹12,450</strong></td></tr>
          <tr><th>Invoice</th><td><strong>INV-2026-0917</strong></td></tr>
          <tr><th>Desk code</th><td>FD3-2201</td></tr>
          <tr><th>Counter</th><td>Front Desk 3</td></tr>
        </table>
      </section>

      <section class="card">
        <h2>Payment acknowledgment</h2>
        <form id="pay-form">
          <label for="invoice_input">Invoice number</label>
          <input id="invoice_input" name="invoice_input" type="text" value="" autocomplete="off" />

          <label for="desk_code">Desk code</label>
          <input id="desk_code" name="desk_code" type="text" value="" autocomplete="off" />

          <label for="confirm_amount" style="display:flex;gap:0.5rem;align-items:flex-start;margin-top:0.85rem;color:var(--ink)">
            <input id="confirm_amount" name="confirm_amount" type="checkbox" style="width:auto;margin-top:0.2rem" />
            <span>I confirm the amount due is <strong>₹12,450</strong>.</span>
          </label>

          <button id="pay" type="submit">Confirm payment</button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      document.getElementById('pay-form').addEventListener('submit', (event) => {
        event.preventDefault()
        const invoice = (document.getElementById('invoice_input').value || '').trim()
        const desk = (document.getElementById('desk_code').value || '').trim()
        const checked = document.getElementById('confirm_amount').checked
        const statusEl = document.getElementById('status')

        if (invoice !== 'INV-2026-0917' || desk !== 'FD3-2201' || !checked) {
          statusEl.style.color = 'var(--warn)'
          statusEl.textContent =
            'Please enter the invoice number, desk code, and confirm the amount due.'
          return
        }

        statusEl.style.color = 'var(--accent)'
        statusEl.textContent =
          'Payment confirmed. Amount ₹12,450 · Invoice INV-2026-0917.'
      })
    </script>
  </body>
</html>
